# Echo P1 数据源配置（PostgreSQL + pgvector）
# 由 com.echo.bootstrap.EchoDatabase 通过 -Decho.db.config=<本文件路径> 加载，
# 并以 com.echo.infra.persistence.PgDb(Properties) 的真实读法解析下列键：
#   db.name           -> PgDbManager 注册名，必须与各仓储 @CRepository(source=...) 一致 = "echo"
#   jdbcUrl           -> HikariConfig.setJdbcUrl
#   driverClassName   -> HikariConfig.setDriverClassName
#   username/password -> HikariConfig.setUsername / setPassword
#   maximumPoolSize   -> HikariConfig.setMaximumPoolSize
db.name=echo
jdbcUrl=jdbc:postgresql://127.0.0.1:5432/echo
driverClassName=org.postgresql.Driver
username=echo
password=echo
maximumPoolSize=8
